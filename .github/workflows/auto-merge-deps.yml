# Auto-merge dependency updates using the org-level reusable workflow.
# merge-strategy: merge, because main requires signed commits and GitHub
# cannot sign a rebase merge: every rebase attempt is refused.
name: Auto-merge dependency PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
    with:
      merge-strategy: merge
    permissions:
      contents: write
      pull-requests: write
