# Auto-merge dependency updates using the org-level reusable workflow.
# merge-strategy: merge, because main requires signed commits and GitHub
# cannot sign a rebase merge: every rebase attempt is refused.
name: Auto-merge dependency PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    # The reusable checks only the PR author. This also requires the bot to
    # have triggered the event, so that a human push to a bot branch or a
    # human reopen is not approved and merged unreviewed.
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]'
    uses: netresearch/.github/.github/workflows/auto-merge-deps.yml@main
    with:
      merge-strategy: merge
    permissions:
      contents: write
      pull-requests: write
